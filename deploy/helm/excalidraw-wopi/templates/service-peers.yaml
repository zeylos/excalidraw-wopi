{{- if .Values.peerDiscovery.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "excalidraw-wopi.peersServiceName" . }}
  labels:
    {{- include "excalidraw-wopi.labels" . | nindent 4 }}
spec:
  clusterIP: None
  # Readiness gates the peer set, so a pod that is not ready never owns a room.
  publishNotReadyAddresses: false
  selector:
    {{- include "excalidraw-wopi.selectorLabels" . | nindent 4 }}
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
{{- end }}
