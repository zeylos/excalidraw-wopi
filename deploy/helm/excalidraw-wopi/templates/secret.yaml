{{- if .Values.secret.create }}
# Use this path for tests only. Use an existing Secret in production.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "excalidraw-wopi.managedSecretName" . }}
  labels:
    {{- include "excalidraw-wopi.labels" . | nindent 4 }}
type: Opaque
stringData:
  proof-key.pem: {{ required "secret.proofKeyPem is required when secret.create is true." .Values.secret.proofKeyPem | quote }}
  session-secret: {{ required "secret.sessionSecret is required when secret.create is true." .Values.secret.sessionSecret | quote }}
{{- end }}
