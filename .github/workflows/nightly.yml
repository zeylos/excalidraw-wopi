name: Nightly E2E

# Slow, time-based scenarios that do not fit the PR gate: lock refresh past
# TTL, token expiry, syncer failover, a reconnection storm, the conflict
# prompt.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  nightly:
    name: Nightly E2E suite
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e/playwright/package-lock.json
            e2e/nightly/package-lock.json

      - name: Start e2e stack
        run: make e2e-up

      - name: Run nightly suite
        run: make e2e-nightly

      - name: Capture e2e stack logs
        if: always()
        run: mkdir -p e2e/.run && docker compose -f e2e/compose.yaml logs > e2e/.run/docker-compose.log 2>&1

      - name: Stop e2e stack
        if: always()
        run: make e2e-down

      - name: Upload Playwright traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces-nightly
          path: |
            e2e/playwright/test-results/
            e2e/playwright/playwright-report/
            e2e/playwright/test-results-nightly/
            e2e/playwright/playwright-report-nightly/
            e2e/.run/*.log
          retention-days: 7
          if-no-files-found: ignore

  drive-integration:
    name: Drive integration suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Start e2e stack
        run: make e2e-up

      - name: Run Drive integration suite
        run: make test-drive-integration

      - name: Stop e2e stack
        if: always()
        run: make e2e-down

      - name: Upload e2e logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: drive-integration-logs
          path: e2e/.run/*.log
          retention-days: 7
          if-no-files-found: ignore
