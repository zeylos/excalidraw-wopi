name: E2E smoke

# PR gate: two browsers draw at the same time, save, reload, check read-only
# rendering.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Playwright smoke suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e/playwright/package-lock.json

      - name: Start e2e stack
        run: make e2e-up

      - name: Run smoke suite
        run: make e2e-smoke

      - name: Capture e2e stack logs
        if: always()
        run: docker compose -f e2e/compose.yaml logs > e2e/.run/docker-compose.log 2>&1

      - name: Stop e2e stack
        if: always()
        run: make e2e-down

      - name: Upload Playwright traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces-smoke
          path: |
            e2e/playwright/test-results/
            e2e/playwright/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload e2e logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-smoke-logs
          path: e2e/.run/*.log
          retention-days: 7
          if-no-files-found: ignore
